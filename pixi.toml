[workspace]
authors = ["AbderrahimAl <abderrahimalakouche@gmail.com>"]
channels = ["knime", "conda-forge", "abderrahimal", "Esri", "deepmodeling"]
name = "py39_bert_cpu"
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.9.*"
py4j = "*"
nomkl = "*"
pandas = "*"
numpy = "*"
pyarrow = "<8.0"
protobuf = "<4.0"
sentencepiece = "*"
termcolor = "2.0.1.*"
setuptools = "<70"
bert-for-tf2 = "0.14.9.*"
transformers = "4.6.1.*"
pip = "*"

[target.linux-64.dependencies]
tensorflow = "==2.8.1"
tensorflow-hub = "==0.12.0"

# macOS: CPU builds on conda-forge
[target.osx-64.dependencies]
tensorflow = "==2.8.1"
tensorflow-hub = "==0.12.0"
[target.osx-arm64.dependencies]
tensorflow = "==2.8.1"
tensorflow-hub = "==0.12.0"

# Windows: pull prebuilt wheel from PyPI (no source builds)
[target.win-64.pypi-dependencies]
tensorflow = "==2.8.1"
tensorflow-hub = "==0.12.0"


[feature.build.dependencies]
python = "3.9.*"
knime-extension-bundling = "5.*"

[feature.debug.dependencies]
debugpy = "*"

[feature.build.tasks]
build = { args = [{ "arg" = "dest", "default" = "./local-update-site" }], cmd = "build-python-extension . {{ dest }} --disable-strict-enforcement"}

[environments]
build = {features = ["build"], no-default-feature = true}
debug = {features = ["debug"]}